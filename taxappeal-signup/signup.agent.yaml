# Sign up + Chase desk on Naive. Apply with: naive agent update <agent-id> -f signup.agent.yaml  (setup.sh does it)
name: signup
description: >
  Sign up and Chase desk. Answers homeowners who write to the Claim OS inbox, collects what Evidence
  needs, sends the authorization form, follows up once, and puts each new owner on the company board.
  Phone only for county offices and owners who asked to be called. Never cold-contacts anyone.
model: anthropic/claude-haiku-5.5
harness: pi
window: immediate   # owners are waiting for a reply

budget:
  cap_usd: 5          # per day
  max_task_usd: 0.30  # one 15-minute pass
  period: day

system_file: signup.system.md

# Both bearers live in the identity's vault, matched to these URLs and injected server-side (setup.sh stores them).
mcp_servers:
  - { type: url, name: agentmail, url: "https://mcp.agentmail.to/mcp" }
  - { type: url, name: monid, url: "https://mcp.monid.ai/v1" }

tools:
  default_config:
    permission: ask   # anything not named below stops for a person
  configs:
    board_read: { enabled: true, permission: allow }
    board_write: { enabled: true, permission: allow }
    ask_operator: { enabled: true, permission: ask }
    session_spend: { enabled: true, permission: allow }
    # AgentMail through its hosted MCP server. Policy keys are <server>.<tool>; the model calls them
    # agentmail__list_messages etc. Its other ~50 tools stay at ask. Replies go out without approval
    # (Francesco's call, 2026-11-07); the prompt's content rules are the only gate.
    agentmail.list_messages: { enabled: true, permission: allow }
    agentmail.get_message: { enabled: true, permission: allow }
    agentmail.reply_to_message: { enabled: true, permission: allow }
    # Naive's own agent_mail connection is broken server-side (every op: "execute() got an unexpected
    # keyword argument 'request'", 2026-11-07); kept out of the model's reach until Naive fixes it.
    agent_mail.list_messages: { enabled: false, permission: deny }
    agent_mail.get_message: { enabled: false, permission: deny }
    agent_mail.send_email: { enabled: false, permission: deny }
    # Monid: reads are free to run, the call itself is approved. Names from Monid's MCP tools/list.
    monid.monid_discover: { enabled: true, permission: allow }
    monid.monid_inspect: { enabled: true, permission: allow }
    monid.monid_run: { enabled: true, permission: ask }
    monid.monid_get_run: { enabled: true, permission: allow }

metadata:
  desk: property_tax
  step: signup
  company: Claim OS
