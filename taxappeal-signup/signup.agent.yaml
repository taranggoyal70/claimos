# Sign up + Chase desk on Naive. Apply with: naive agent update <agent-id> -f signup.agent.yaml  (setup.sh does it)
name: signup
description: >
  Sign up and Chase desk. Answers homeowners who write to the Claim OS inbox, collects what Evidence
  needs, sends the authorization form, follows up once, and puts each new owner on the company board.
  Phone only for county offices and owners who asked to be called. Never cold-contacts anyone.
model: anthropic/claude-haiku-5.5
harness: pi
window: immediate   # owners are waiting for a reply

budget:
  cap_usd: 5          # per day
  max_task_usd: 0.30  # one 15-minute pass
  period: day

system_file: signup.system.md

# Monid (phone). The bearer lives in the vault, matched to this URL and injected server-side.
mcp_servers:
  - { type: url, name: monid, url: "https://mcp.monid.ai/v1" }

tools:
  default_config:
    permission: ask   # anything not named below stops for a person
  configs:
    board_read: { enabled: true, permission: allow }
    board_write: { enabled: true, permission: allow }
    ask_operator: { enabled: true, permission: ask }
    session_spend: { enabled: true, permission: allow }
    # AgentMail, through the org's agent_mail connection; the key lives on the connection, not here.
    # Naive exposes only these three operations and governs them as <connector>.<short name> (seen in a
    # session's tool.confirm event); the model calls them agent_mail__list_messages etc. No thread, label
    # or reply tools exist, so state lives on the board.
    # Sends go out without approval (Francesco's call, 2026-11-07); the prompt's content rules are the only gate.
    agent_mail.list_messages: { enabled: true, permission: allow }
    agent_mail.get_message: { enabled: true, permission: allow }
    agent_mail.send_email: { enabled: true, permission: allow }
    # Monid: reads are free to run, the call itself is approved. Names from Monid's MCP tools/list.
    monid.monid_discover: { enabled: true, permission: allow }
    monid.monid_inspect: { enabled: true, permission: allow }
    monid.monid_run: { enabled: true, permission: ask }
    monid.monid_get_run: { enabled: true, permission: allow }

metadata:
  desk: property_tax
  step: signup
  company: Claim OS
