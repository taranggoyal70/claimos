# Sign up desk on Naive: owner conversations from the inbox (hourly schedule) and Message · cards other desks
# assign to it. setup.sh applies it; `naive agent update <id> -f signup.agent.yaml` from this folder re-applies.
name: signup
description: >
  Sign up desk. Answers homeowners who write to the Claim OS inbox, collects what Evidence needs, sends
  the authorization form, follows up once, and puts each owner on the company board. Replies only;
  never writes to anyone first, never calls. County offices and call-backs are the outreach agent's job.
model: anthropic/claude-haiku-5.5
harness: pi
window: immediate   # owners are waiting for a reply

budget:
  cap_usd: 5          # per day
  max_task_usd: 2.00  # one pass; each approval resumes the session and re-sends ~100k tokens; 1.00 was raised live on 2026-11-08
  period: day

system_file: signup.system.md

# AgentMail's hosted MCP server; the bearer lives in the vault, matched to this URL, injected server-side.
mcp_servers:
  - { type: url, name: agentmail, url: "https://mcp.agentmail.to/mcp" }

tools:
  default_config:
    permission: ask   # anything not named below stops for a person
  configs:
    board_read: { enabled: true, permission: allow }
    board_write: { enabled: true, permission: allow }
    ask_operator: { enabled: false, permission: ask }  # off since 2026-11-08: questions go on the owner's card instead
    session_spend: { enabled: true, permission: allow }
    # Three mail operations. Naive still holds every send for approval once a session has read mail.
    agentmail.list_messages: { enabled: true, permission: allow }
    agentmail.get_message: { enabled: true, permission: allow }
    agentmail.reply_to_message: { enabled: true, permission: allow }
    agentmail.send_message: { enabled: true, permission: allow }  # only for a `Message ·` card (see signup.system.md)

metadata:
  desk: property_tax
  step: signup
  company: Claim OS
