# Outreach desk on Naive: contacts county offices, or an owner who asked for a call, when a board card
# assigned to "outreach" asks for it. No schedule: assigning the card is what starts it. setup.sh applies it.
name: outreach
description: >
  Outreach desk. Takes a board card from another desk and gets what it asks for from the outside world:
  a county office's deadline, hearing date or filing rule (by email, then phone), or a call back to an
  owner who asked for one. Never contacts an owner first. Answers go on the card.
model: anthropic/claude-haiku-5.5
harness: pi
window: immediate

budget:
  cap_usd: 5          # per day
  max_task_usd: 0.50  # one card
  period: day

system_file: outreach.system.md

mcp_servers:
  - { type: url, name: agentmail, url: "https://mcp.agentmail.to/mcp" }
  - { type: url, name: monid, url: "https://mcp.monid.ai/v1" }

tools:
  default_config:
    permission: ask
  configs:
    board_read: { enabled: true, permission: allow }
    board_write: { enabled: true, permission: allow }
    ask_operator: { enabled: true, permission: ask }
    session_spend: { enabled: true, permission: allow }
    agentmail.list_messages: { enabled: true, permission: allow }
    agentmail.get_message: { enabled: true, permission: allow }
    agentmail.send_message: { enabled: true, permission: allow }      # new email to a county office
    agentmail.reply_to_message: { enabled: true, permission: allow }  # continue an office or owner thread
    monid.monid_discover: { enabled: true, permission: allow }
    monid.monid_inspect: { enabled: true, permission: allow }
    monid.monid_run: { enabled: true, permission: ask }               # a phone call always asks
    monid.monid_get_run: { enabled: true, permission: allow }

metadata:
  desk: property_tax
  step: outreach
  company: Claim OS
