# The Evidence agent on Naive. Apply with: naive agent apply -f naive/
# Field names copied from Find's naive/find.agent.yaml (@usenaive-sdk/cli 1.0); not yet applied to a live org.
name: evidence
description: >
  Evidence desk. Takes property-tax cases from its board, builds the hearing packet (comparable sales,
  similar homes' assessments, requested value, evidence-exchange deadline), lists what to ask the owner for,
  and posts the packet to the File agent's board. Never contacts owners, never files anything.

# The work is a Python program run with bash, so a mid-size model is plenty.
model: openai/gpt-oss-120b
window: loose   # scheduled background work; no one is waiting on it

budget:
  cap_usd: 20       # per period, model calls
  max_task_usd: 2   # one scheduled run
  period: month

system_file: naive/evidence.system.md

skills:
  - taxevidence   # pushed by setup.sh from naive/SKILL.md

tools:
  default_config:
    permission: deny   # closed by default; only what Evidence needs is opened below
  configs:
    bash: { enabled: true, permission: allow }
    read: { enabled: true, permission: allow }
    write: { enabled: true, permission: allow }
    ls: { enabled: true, permission: allow }
    fetch_file: { enabled: true, permission: allow }     # pull the code zip when there is no git repo
    publish_file: { enabled: true, permission: allow }   # publish each packet PDF
    board_read: { enabled: true, permission: allow }
    board_write: { enabled: true, permission: allow }
    ask_operator: { enabled: true, permission: allow }   # a human decides anything irreversible
    session_spend: { enabled: true, permission: allow }

metadata:
  desk: property_tax
  step: evidence
  hands_off_to: file
