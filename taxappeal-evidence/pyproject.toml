[project]
name = "taxappeal-evidence"
version = "0.1.0"
description = "Evidence step of the property-tax appeal loop: builds the hearing packet for one case."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
taxevidence = "taxevidence.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taxevidence"]

[tool.setuptools.package-data]
taxevidence = ["sample_case.json"]
